name: Branch Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and ZIP
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          # Package the debug apk as Magisk module zip
          mkdir -p output
          cd MagiskModBase
          zip -r ../output/PixelXpert-Next.zip ./*
          cd ..
          zip -j output/PixelXpert-Next.zip app/build/outputs/apk/debug/PixelXpert-Next.apk

      - name: Delete existing release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ github.ref_name }}"
          gh release delete "$TAG_NAME" --cleanup-tag -y || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.ref_name }}
          name: Build for ${{ github.ref_name }}
          body: |
            Automated build for branch `${{ github.ref_name }}`.
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
            output/PixelXpert-Next.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
