name: Branch Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and ZIP
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          # Package the debug apk as Magisk module zip
          mkdir -p output

          # Copy MagiskModBase files to a staging directory to zip them properly
          cp -r MagiskModBase staging

          # Find the debug APK and copy it to the staging directory with the exact name expected by the script
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" staging/PixelXpert-Next.apk

          # Create the zip file from the staging directory
          cd staging
          zip -r ../output/PixelXpert-Next.zip ./*
          cd ..

          # Clean up
          rm -rf staging

      - name: Delete existing release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ github.ref_name }}"
          gh release delete "$TAG_NAME" --cleanup-tag -y || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.ref_name }}
          name: Build for ${{ github.ref_name }}
          body: |
            Automated build for branch `${{ github.ref_name }}`.
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
            output/PixelXpert-Next.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
